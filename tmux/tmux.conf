source-file ~/.config/tmux/tmux.reset.conf
if-shell 'infocmp -x tmux-256color >/dev/null 2>&1' 'set-option -g default-terminal "tmux-256color"' 'set-option -g default-terminal "screen-256color"'
set-option -g terminal-overrides ',xterm-ghostty:RGB,xterm-256color:RGB'
if-shell 'tmux show -gv terminal-features >/dev/null 2>&1' 'set-option -g terminal-features ",xterm-ghostty:usstyle,xterm-256color:usstyle"'

set -g prefix ^A
set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g focus-events on
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
setw -g mode-keys vi
set -g mouse on

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Keep TPM/plugin path consistent across XDG and legacy installs.
if-shell '[ -d ~/.config/tmux/plugins ]' 'set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/plugins/' 'set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
# When ~/.config/tmux is a symlink into this repo, tmux/.. resolves to the dotfiles root.
set -g @sessionx-custom-paths "$HOME/.config/tmux/.."
set -g @sessionx-bind 'o'
set -g @sessionx-x-path "$HOME/.config/tmux/.."
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
#set -g @catppuccin_window_middle_separator "█"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "all"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "all"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_session_icon "⌨"
set -g @catppuccin_session_color "#{?client_prefix,$thm_red,#{?pane_in_mode,$thm_yellow,$thm_green}}"
set -g @catppuccin_session_text "#{?client_prefix,PREFIX,#{?pane_in_mode,COPY,#S}}"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_connect_separator "yes"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
# set -g @catppuccin_meetings_text "#($HOME/.config/tmux/scripts/cal.sh)"
# set -g @catppuccin_date_time_text "%H:%M"

run-shell 'if [ -x ~/.config/tmux/plugins/tpm/tpm ]; then ~/.config/tmux/plugins/tpm/tpm; elif [ -x ~/.tmux/plugins/tpm/tpm ]; then ~/.tmux/plugins/tpm/tpm; fi'

# Keep tmux panes transparent while preserving Catppuccin foreground and border contrast.
set -g window-style 'fg=#bac2de,bg=default'
set -g window-active-style 'fg=#cdd6f4,bg=default'
set -g message-style 'fg=#cdd6f4,bg=#313244,align=centre'
set -g message-command-style 'fg=#cdd6f4,bg=#313244,align=centre'
setw -g mode-style 'fg=#11111b,bg=#f9e2af,bold'
set -g pane-border-style 'fg=#6c7086,bg=default'
set -g pane-active-border-style 'fg=#89b4fa,bg=default'
