# Meta/Alt-focused tmux configuration.
# Prefix is still Ctrl-a, but common actions are available directly with Alt/Meta.

# Terminal capabilities
if-shell 'infocmp -x tmux-256color >/dev/null 2>&1' \
  'set-option -g default-terminal "tmux-256color"' \
  'set-option -g default-terminal "screen-256color"'
set-option -g terminal-overrides ',alacritty:RGB,xterm-ghostty:RGB,xterm-256color:RGB'
if-shell 'tmux show -gv terminal-features >/dev/null 2>&1' \
  'set-option -g terminal-features ",alacritty:RGB:usstyle,xterm-ghostty:RGB:usstyle,xterm-256color:RGB:usstyle"'

# Core behavior
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g focus-events on
set -g history-limit 1000000
set -g set-clipboard on
set -g mouse on
setw -g mode-keys vi

# Keep this non-zero so terminals that encode Meta as ESC+key are reliable.
# If Escape feels too slow in editors, try lowering this to 5 or 0.
set -g escape-time 10

# Prefix fallbacks / essentials
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message 'Reloaded ~/.config/tmux/tmux.conf'
bind-key d detach-client
bind-key c new-window -c '#{pane_current_path}'
bind-key x kill-pane
bind-key & kill-window
bind-key : command-prompt
bind-key [ copy-mode
bind-key w choose-tree -Zw
bind-key S choose-session
bind-key z resize-pane -Z
bind-key | split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Meta/Alt pane navigation, no prefix
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Meta/Alt pane resizing, no prefix
bind-key -n M-, resize-pane -L 5
bind-key -n M-. resize-pane -R 5
bind-key -n M-- resize-pane -D 3
bind-key -n M-= resize-pane -U 3

# Meta/Alt windows and sessions, no prefix
bind-key -n M-p previous-window
bind-key -n M-n next-window
bind-key -n M-H previous-window
bind-key -n M-L next-window
bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9
bind-key -n M-w choose-tree -Zw
bind-key -n M-S choose-session

# Meta/Alt actions, no prefix
bind-key -n M-c new-window -c '#{pane_current_path}'
bind-key -n M-s split-window -v -c '#{pane_current_path}'
bind-key -n M-v split-window -h -c '#{pane_current_path}'
bind-key -n M-z resize-pane -Z
bind-key -n M-r source-file ~/.config/tmux/tmux.conf \; display-message 'Reloaded ~/.config/tmux/tmux.conf'
bind-key -n M-[ copy-mode

# Vi copy-mode helpers
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Status bar / theme
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 80
set -g status-right-length 120
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'

# Left: prefix alert + session name
set -g status-left '#{?client_prefix,#[fg=#1e1e2e,bg=#f38ba8,bold] PREFIX #[fg=#f38ba8,bg=#89b4fa,nobold],}#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#313244,nobold]'

# Windows
set -g window-status-separator ''
set -g window-status-format '#[fg=#cdd6f4,bg=#313244] #I:#W '
set -g window-status-current-format '#[fg=#1e1e2e,bg=#f9e2af,bold] #I:#W #[fg=#f9e2af,bg=#1e1e2e,nobold]'
set -g window-status-style 'fg=#cdd6f4,bg=#313244'
set -g window-status-current-style 'fg=#1e1e2e,bg=#f9e2af,bold'

# Right: current path + clock
set -g status-right '#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] #{b:pane_current_path} #[fg=#89b4fa,bg=#313244]#[fg=#1e1e2e,bg=#89b4fa,bold] %H:%M '

# Pane borders and tmux messages
set -g pane-border-style 'fg=#45475a,bg=default'
set -g pane-active-border-style 'fg=#89b4fa,bg=default'
set -g message-style 'fg=#cdd6f4,bg=#313244,align=centre'
set -g message-command-style 'fg=#cdd6f4,bg=#313244,align=centre'
setw -g mode-style 'fg=#1e1e2e,bg=#89b4fa,bold'
set -g window-style 'fg=#bac2de,bg=default'
set -g window-active-style 'fg=#cdd6f4,bg=default'
